# Use postgres/example user/password credentials
version: '3.7'

services:
  project_db:
    container_name: project_db
    image: postgres
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - '4381:5432'
  front:
    build:
      context: .
      dockerfile: DockerfileFront
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    ports:
      - '3000:3000'
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JWT_SECRET: ${JWT_SECRET}
        DB_DIALECT: ${DB_DIALECT}
        PROD_DB_HOSTNAME: ${PROD_DB_HOSTNAME}
        DB_NAME: ${DB_NAME}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_USERNAME: ${DB_USERNAME}
        PORT: ${PORT}
        NODE_ENV: production
    ports:
      - '${PORT}:5000'
    depends_on:
      - project_db
    links:
      - 'project_db:project_db'
    volumes:
      - ./assets:/app/src/lib/assets
  migration:
    build:
      context: .
      dockerfile: DockerfileMigration
      args:
        DB_DIALECT: ${DB_DIALECT}
        PROD_DB_HOSTNAME: ${PROD_DB_HOSTNAME}
        DB_NAME: ${DB_NAME}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_USERNAME: ${DB_USERNAME}
        PORT: ${PORT}
        NODE_ENV: production
    command: ['./wait-for-it/wait-for-it.sh', 'project_db:5432', '--', 'npm', 'run', 'predeploy']
    links:
      - project_db
    environment:
      - NODE_ENV=production
    depends_on:
      - api
      - project_db
    volumes:
      - ./migrations:/app/src/lib/migrations
      - ./seeds:/app/src/lib/seeds
  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: always
    user: postgres:postgres # Optional: see below
    volumes:
      - ./db_backups:/backups
    links:
      - project_db
    depends_on:
      - project_db
    environment:
      - POSTGRES_HOST=${PROD_DB_HOSTNAME}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
