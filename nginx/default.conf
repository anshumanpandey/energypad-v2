server {
        listen 80;
        listen [::]:80;
        error_log /var/log/nginx/error_log_energypad_80;

        server_name app.energiepad.com;

        add_header Strict-Transport-Security "max-age=0";

        root /home/zakajia/Energiepad/energiepadui/build;
        index index.html;

        #location / {
        #try_files $uri $uri/ =404;
        #}

        location / {
                proxy_pass http://localhost:3000;
        }

        location /api {
                proxy_pass http://localhost:5000;
        }

        location /assets {
                proxy_pass http://localhost:5000;
        }
}

