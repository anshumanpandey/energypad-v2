# Temporary HTTP preview. Replace with domain/TLS configuration before real use.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 16.60.161.140;
    # Authentication and invitation URLs can contain tokens; do not log them.
    access_log off;
    error_log /var/log/nginx/energiepad-error.log crit;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host 16.60.161.140;
        proxy_set_header X-Forwarded-Host 16.60.161.140;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
